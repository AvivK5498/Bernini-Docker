version: 2.1

executors:
  docker-dind:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    resource_class: xlarge
    environment:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  build_and_push:
    executor: docker-dind
    steps:
      - checkout
      - run:
          name: Log in to Docker Hub
          command: |
            echo "$DOCKERHUB_PAT" | docker login -u "$DOCKERHUB_USER" --password-stdin
      - run:
          name: Build and push Bernini serverless image
          no_output_timeout: 60m
          command: |
            TAG="${CIRCLE_TAG:-latest}"
            IMG="docker.io/$DOCKERHUB_USER/bernini-serverless"
            CACHE_TAG="buildcache"

            docker pull "${IMG}:${CACHE_TAG}" || true
            docker build \
              --progress=plain \
              --cache-from "${IMG}:${CACHE_TAG}" \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t "${IMG}:${TAG}" .
            docker push "${IMG}:${TAG}"
            docker tag "${IMG}:${TAG}" "${IMG}:${CACHE_TAG}"
            docker push "${IMG}:${CACHE_TAG}"

workflows:
  version: 2
  build_on_tag:
    jobs:
      - build_and_push:
          context:
            - docker-hub
          filters:
            tags:
              only: /^v[0-9]+(\.[0-9]+)*$/
            branches:
              ignore: /.*/

